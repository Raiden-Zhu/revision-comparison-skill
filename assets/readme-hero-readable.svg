<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="580" viewBox="0 0 1400 580" role="img" aria-labelledby="title desc">
  <title id="title">Revision Comparison — an agent skill</title>
  <desc id="desc">The original banner layout with the contextual timing example: optimization becomes end-to-end training while 38% stays unchanged. A labeled editor summary of the timing protocol and an inferred explanation identify a broader claim needing author review.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E8EBF0" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="135%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#26324D" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1400" height="580" rx="24" fill="#FAFBFD"/>
  <rect x="644" width="756" height="580" fill="url(#grid)" opacity=".65"/>
  <path d="M 1400 0 L 1400 580 L 1040 580" fill="none" stroke="#DDE3EC" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="65" width="170" height="36" rx="18" fill="#EDE7F3"/>
    <circle cx="89" cy="83" r="4" fill="#742F75"/>
    <text x="103" y="89" fill="#5E3069" font-size="17" font-weight="700" letter-spacing="1.4">AGENT SKILL</text>
    <g fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" letter-spacing="-3">
      <text x="68" y="219">Revision</text>
      <text x="68" y="313">Comparison</text>
    </g>
    <text x="72" y="377" fill="#48566B" font-size="28">See what changed.</text>
    <text x="72" y="418" fill="#48566B" font-size="28">Understand why it matters.</text>
    <path d="M 73 479 H 129" stroke="#742F75" stroke-width="3" stroke-linecap="round"/>
    <text x="145" y="486" fill="#566378" font-size="18" letter-spacing=".6">PASSAGES · CONTEXT · REASONS</text>

    <rect x="690" y="55" width="642" height="470" rx="18" fill="url(#paper)" stroke="#DBE1EB" filter="url(#shadow)"/>
    <text x="725" y="100" fill="#172033" font-size="26" font-weight="700">C3</text>
    <text x="772" y="100" fill="#647086" font-size="23">Summary / timing claim</text>
    <path d="M 725 119 H 1297" stroke="#E4E8F0"/>
    <rect x="725" y="140" width="572" height="68" rx="9" fill="#EAF1EB"/>
    <text x="745" y="166" fill="#416748" font-size="14" font-weight="700" letter-spacing="1">CONTEXT · EDITOR SUMMARY</text>
    <text x="1278" y="166" text-anchor="end" fill="#5A7360" font-size="12">After · Evaluation Protocol ¶2</text>
    <text x="745" y="193" fill="#35543B" font-size="22">Timing excludes feature precomputation.</text>

    <text x="727" y="238" fill="#647086" font-size="17" font-weight="700" letter-spacing="1.2">BEFORE</text>
    <text x="730" y="270" fill="#172033" font-size="29">The adapter reduces</text>
    <rect x="724" y="279" width="168" height="36" rx="5" fill="#F2E6EF"/>
    <text x="730" y="306" fill="#172033" font-size="29">optimization time by 38%.</text>
    <path d="M 741 323 V 342 M 735 336 L 741 342 L 747 336" fill="none" stroke="#8893A7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="727" y="362" fill="#647086" font-size="17" font-weight="700" letter-spacing="1.2">AFTER</text>
    <text x="730" y="390" fill="#172033" font-size="29">The adapter reduces</text>
    <rect x="724" y="399" width="256" height="36" rx="5" fill="#F2E6EF"/>
    <text x="730" y="426" fill="#172033" font-size="29"><tspan fill="#742F75">end-to-end training</tspan> time by 38%.</text>

    <path d="M 725 447 H 1297" stroke="#E4E8F0"/>
    <text x="727" y="474" fill="#416748" font-size="15" font-weight="700" letter-spacing="1.1">REVIEW NOTE · INFERRED</text>
    <text x="727" y="503" fill="#48566B" font-size="22">The reported 38% reduction is for optimization time only.</text>
    <text x="1295" y="550" text-anchor="end" fill="#647086" font-size="14" letter-spacing=".8">SYNTHETIC · AUTHOR REVIEW NEEDED</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title desc">
  <title id="title">Revision Comparison — review an edit with its source context</title>
  <desc id="desc">A synthetic comparison changes a 38% optimization-time claim to a 38% end-to-end-training-time claim. The exact timing protocol excludes feature precomputation. Before and after passages, their source context, an inferred interpretation, and author review status are shown together.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#E8EBF0" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="135%" height="145%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#26324D" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1400" height="680" rx="24" fill="#FAFBFD"/>
  <rect x="614" width="786" height="680" fill="url(#grid)" opacity=".65"/>
  <path d="M 1400 0 L 1400 680 L 1012 680" fill="none" stroke="#DDE3EC" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="68" y="79" width="170" height="36" rx="18" fill="#EDE7F3"/>
    <circle cx="87" cy="97" r="4" fill="#742F75"/>
    <text x="101" y="103" fill="#5E3069" font-size="17" font-weight="700" letter-spacing="1.4">AGENT SKILL</text>
    <g fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700" letter-spacing="-3">
      <text x="65" y="252">Revision</text>
      <text x="65" y="343">Comparison</text>
    </g>
    <text x="70" y="413" fill="#48566B" font-size="27">See what changed.</text>
    <text x="70" y="454" fill="#48566B" font-size="27">Understand why it matters.</text>
    <path d="M 71 554 H 127" stroke="#742F75" stroke-width="3" stroke-linecap="round"/>
    <text x="143" y="561" fill="#566378" font-size="17" letter-spacing=".6">PASSAGES · CONTEXT · REASONS</text>

    <rect x="650" y="42" width="686" height="588" rx="18" fill="url(#paper)" stroke="#DBE1EB" filter="url(#shadow)"/>
    <text x="686" y="80" fill="#172033" font-size="26" font-weight="700">C3</text>
    <text x="733" y="80" fill="#647086" font-size="23">Summary / timing claim</text>
    <text x="686" y="105" fill="#647086" font-size="12" font-weight="700" letter-spacing="1.2">SYNTHETIC COMPARISON · SUPPLIED DRAFTS</text>
    <path d="M 686 119 H 1300" stroke="#E4E8F0"/>

    <rect x="686" y="138" width="614" height="112" rx="9" fill="#EAF1EB"/>
    <text x="705" y="162" fill="#416748" font-size="14" font-weight="700" letter-spacing="1">CONTEXT · EXACT SOURCE QUOTE</text>
    <text fill="#35543B" font-size="22" aria-label="Timing starts after feature precomputation and excludes that cost.">
      <tspan x="705" y="190">Timing starts after feature precomputation</tspan>
      <tspan x="705" y="218">and excludes that cost.</tspan>
    </text>
    <text x="705" y="240" fill="#5A7360" font-size="13">After · Evaluation Protocol ¶2 · sentence 2</text>

    <text x="688" y="281" fill="#647086" font-size="15" font-weight="700" letter-spacing="1.2">BEFORE</text>
    <text fill="#172033" font-size="27" aria-label="The adapter reduces optimization time by 38%.">
      <tspan x="705" y="314">The adapter reduces</tspan>
      <tspan x="705" y="347" fill="#742F75">optimization</tspan><tspan xml:space="preserve"> time by 38%.</tspan>
    </text>

    <text x="688" y="388" fill="#647086" font-size="15" font-weight="700" letter-spacing="1.2">AFTER</text>
    <text fill="#172033" font-size="27" aria-label="The adapter reduces end-to-end training time by 38%.">
      <tspan x="705" y="421">The adapter reduces</tspan>
      <tspan x="705" y="454" fill="#742F75">end-to-end training</tspan><tspan xml:space="preserve"> time by 38%.</tspan>
    </text>

    <rect x="686" y="478" width="614" height="77" rx="9" fill="#EAF1EB"/>
    <text x="705" y="502" fill="#416748" font-size="14" font-weight="700" letter-spacing="1">REASON · INFERRED INTERPRETATION</text>
    <text x="705" y="533" fill="#35543B" font-size="21">The protocol does not establish end-to-end timing.</text>

    <rect x="686" y="572" width="614" height="37" rx="7" fill="#F1F3F8" stroke="#E2E7EF"/>
    <text x="703" y="596" fill="#647086" font-size="12" font-weight="700" letter-spacing="1">STATUS</text>
    <text x="773" y="596" fill="#172033" font-size="17">Broader claim · author review needed</text>
    <text x="1334" y="661" text-anchor="end" fill="#647086" font-size="12" letter-spacing="1">COMPARE MODE · AUTHOR INTENT UNKNOWN</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
  <title id="title">A revised excerpt is hard to review on its own.</title>
  <desc id="desc">A received Reporting excerpt leaves the reader to find the original, recover the setup, and work out the change. A source-based review places the retained Protocol condition, three original Reporting paragraphs, their merged revision, and an editor-proposed explanation together. This synthetic example covers C2 and C3 of the structure-edit example.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7F9FC"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="135%" height="145%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#26324D" flood-opacity=".07"/>
    </filter>
  </defs>
  <rect width="1400" height="560" rx="24" fill="#FAFBFD"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="67" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" letter-spacing="-.5">A revised excerpt is hard to review on its own.</text>

    <text x="56" y="130" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">The excerpt you receive</text>
    <rect x="56" y="151" width="369" height="129" rx="10" fill="#FFFFFF" stroke="#DBE1EB"/>
    <text fill="#172033" font-size="23" aria-label="We record test accuracy and report the average across five seeds.">
      <tspan x="78" y="187">We record test accuracy</tspan>
      <tspan x="78" y="219">and report the average</tspan>
      <tspan x="78" y="251">across five seeds.</tspan>
    </text>
    <text x="78" y="326" fill="#566378" font-size="24">Find the original.</text>
    <text x="78" y="363" fill="#566378" font-size="24">Recover the setup.</text>
    <text x="78" y="400" fill="#566378" font-size="24">Work out what changed.</text>
    <path d="M 437 265 H 468 M 459 257 L 468 265 L 459 273" fill="none" stroke="#8893A7" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="507" fill="#647086" font-size="12">Synthetic excerpt · structure-edit · C2 + C3</text>

    <rect x="482" y="95" width="864" height="444" rx="18" fill="url(#paper)" stroke="#DBE1EB" filter="url(#shadow)"/>
    <text x="511" y="128" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700">The same edit, in context</text>

    <rect x="511" y="143" width="807" height="80" rx="9" fill="#EAF1EB"/>
    <text x="529" y="165" fill="#416748" font-size="12.5" font-weight="700" letter-spacing=".8">SOURCE CONTEXT · RETAINED IN BOTH VERSIONS</text>
    <text x="529" y="193" fill="#35543B" font-size="23">We use a fixed training split.</text>
    <text x="529" y="213" fill="#5A7360" font-size="12">Before · Protocol ¶1 · sentence 1 / After · Protocol ¶1</text>

    <rect x="511" y="240" width="390" height="186" rx="9" fill="#FFFFFF" stroke="#DBE1EB"/>
    <text x="529" y="265" fill="#647086" font-size="13" font-weight="700" letter-spacing="1">BEFORE</text>
    <text x="883" y="265" text-anchor="end" fill="#647086" font-size="12">Reporting ¶1–3</text>
    <rect x="530" y="273" width="321" height="29" rx="4" fill="#F1E6EF"/>
    <text x="536" y="294" fill="#172033" font-size="23">The training split is kept fixed.</text>
    <text x="536" y="316" fill="#742F75" font-size="12">Removed here</text>
    <text x="529" y="350" fill="#172033" font-size="23">We record test accuracy.</text>
    <text fill="#172033" font-size="23" aria-label="We report the average across five seeds.">
      <tspan x="529" y="382">We report the average</tspan>
      <tspan x="529" y="409">across five seeds.</tspan>
    </text>

    <rect x="924" y="240" width="394" height="186" rx="9" fill="#FFFFFF" stroke="#DBE1EB"/>
    <text x="942" y="265" fill="#647086" font-size="13" font-weight="700" letter-spacing="1">AFTER</text>
    <text x="1300" y="265" text-anchor="end" fill="#647086" font-size="12">Reporting ¶1</text>
    <text fill="#172033" font-size="23" aria-label="We record test accuracy and report the average across five seeds.">
      <tspan x="942" y="294">We record test accuracy</tspan>
      <tspan x="942" y="327" fill="#742F75">and</tspan><tspan xml:space="preserve"> report the average</tspan>
      <tspan x="942" y="360">across five seeds.</tspan>
    </text>

    <path d="M 527 287 H 500 V 190 H 520 M 514 185 L 520 190 L 514 195" fill="none" stroke="#B494B4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="511" y="443" width="807" height="84" rx="9" fill="#EAF1EB"/>
    <text x="529" y="463" fill="#416748" font-size="12.5" font-weight="700" letter-spacing=".8">EDITOR-PROPOSED EXPLANATION</text>
    <text fill="#35543B" font-size="22" aria-label="The split condition remains in Protocol. The revision removes repetition and joins the metric with its aggregation.">
      <tspan x="529" y="487">The split condition remains in Protocol. The revision</tspan>
      <tspan x="529" y="515">removes repetition and joins the metric with its aggregation.</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">From an AI edit to a contextual review</title>
  <desc id="desc">A request produces a revised draft, raising questions about what changed and why. A review places source context, original and revised passages, and an explanation together.</desc>
  <rect width="1400" height="360" rx="24" fill="#FAFBFD"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="56" y="45" width="394" height="62" rx="12" fill="#EDE7F3"/>
    <text x="78" y="84" fill="#5E3069" font-size="27">“Clarify this paragraph.”</text>
    <rect x="58" y="135" width="100" height="154" rx="9" fill="#FFFFFF" stroke="#DBE1EB"/>
    <path d="M 78 162 H 136 M 78 187 H 136 M 78 237 H 136 M 78 262 H 119" stroke="#BFC8D7" stroke-width="5" stroke-linecap="round"/>
    <path d="M 78 212 H 130" stroke="#742F75" stroke-width="5" stroke-linecap="round"/>
    <text x="185" y="165" fill="#647086" font-size="23">Revised draft</text>
    <g font-family="Georgia, 'Times New Roman', serif" fill="#172033" font-size="35">
      <text x="184" y="213">What changed?</text>
      <text x="184" y="261">Why this edit?</text>
    </g>
    <path d="M 474 205 H 551 M 541 195 L 552 205 L 541 215" fill="none" stroke="#8893A7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="585" y="34" width="759" height="292" rx="18" fill="#FFFFFF" stroke="#DBE1EB"/>
    <text x="614" y="83" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="39" font-weight="700">Review each edit</text>
    <rect x="614" y="106" width="700" height="45" rx="8" fill="#EAF1EB"/>
    <text x="635" y="137" fill="#416748" font-size="27" font-weight="700">Source context</text>
    <path d="M 876 128 H 1008 M 1043 128 H 1197 M 1232 128 H 1288" stroke="#AFC3B3" stroke-width="5" stroke-linecap="round"/>
    <rect x="614" y="166" width="335" height="79" rx="8" fill="#FAFBFD" stroke="#DBE1EB"/>
    <rect x="974" y="166" width="340" height="79" rx="8" fill="#FAFBFD" stroke="#DBE1EB"/>
    <text x="636" y="197" fill="#172033" font-size="27" font-weight="700">Before</text>
    <text x="996" y="197" fill="#172033" font-size="27" font-weight="700">After</text>
    <path d="M 638 222 H 706 M 733 222 H 829 M 856 222 H 922" stroke="#BFC8D7" stroke-width="5" stroke-linecap="round"/>
    <path d="M 998 222 H 1110" stroke="#742F75" stroke-width="5" stroke-linecap="round"/>
    <path d="M 1137 222 H 1210 M 1237 222 H 1287" stroke="#BFC8D7" stroke-width="5" stroke-linecap="round"/>
    <rect x="614" y="263" width="700" height="45" rx="8" fill="#EAF1EB"/>
    <text x="635" y="294" fill="#416748" font-size="27" font-weight="700">Explanation</text>
    <text x="876" y="294" fill="#48566B" font-size="25">What it clarifies or changes</text>
  </g>
</svg>

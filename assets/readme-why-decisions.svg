<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390" role="img" aria-labelledby="title desc">
  <title id="title">Decide what goes into the next draft.</title>
  <desc id="desc">An editorial guide to author decisions: review wording for clarity and voice, follow changes to argument structure, and check altered claims against assumptions, comparisons, and evidence. Discuss edits by change ID and ask the agent to apply your selection.</desc>
  <rect width="1400" height="390" rx="24" fill="#FAFBFD"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="79" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="45" font-weight="700" letter-spacing="-.8">Decide what goes into the next draft.</text>
    <text x="58" y="121" fill="#48566B" font-size="25">A revision can improve prose, reshape an argument, or change a claim.</text>
    <path d="M 56 148 H 1344" stroke="#DDE3EC" stroke-width="1"/>
    <path d="M 56 148 H 126" stroke="#742F75" stroke-width="2" stroke-linecap="round"/>

    <path d="M 465 178 V 304 M 914 178 V 304" stroke="#DDE3EC" stroke-width="1"/>

    <text x="58" y="186" font-size="17" font-weight="700" letter-spacing="1.3" aria-label="01 · LANGUAGE"><tspan fill="#742F75">01</tspan><tspan fill="#647086" xml:space="preserve"> · LANGUAGE</tspan></text>
    <text x="56" y="231" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="-.2">Is the wording clearer?</text>
    <text fill="#416748" font-size="25" aria-label="Check terminology and author voice.">
      <tspan x="58" y="273">Check terminology</tspan>
      <tspan x="58" y="304">and author voice.</tspan>
    </text>

    <text x="507" y="186" font-size="17" font-weight="700" letter-spacing="1.3" aria-label="02 · STRUCTURE"><tspan fill="#742F75">02</tspan><tspan fill="#647086" xml:space="preserve"> · STRUCTURE</tspan></text>
    <text x="505" y="231" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="-.2">Does the argument flow?</text>
    <text fill="#416748" font-size="25" aria-label="Follow moved and merged passages.">
      <tspan x="507" y="273">Follow moved and</tspan>
      <tspan x="507" y="304">merged passages.</tspan>
    </text>

    <text x="956" y="186" font-size="17" font-weight="700" letter-spacing="1.3" aria-label="03 · MEANING"><tspan fill="#742F75">03</tspan><tspan fill="#647086" xml:space="preserve"> · MEANING</tspan></text>
    <text x="954" y="231" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-weight="700" letter-spacing="-.2">Has the claim changed?</text>
    <text fill="#416748" font-size="25" aria-label="Check assumptions, comparisons, and evidence.">
      <tspan x="956" y="273">Check assumptions,</tspan>
      <tspan x="956" y="304">comparisons, and evidence.</tspan>
    </text>

    <path d="M 56 329 H 1344" stroke="#DDE3EC" stroke-width="1"/>
    <text x="58" y="364" fill="#566378" font-size="22">Discuss edits by change ID. Ask the agent to apply your selection.</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="760" height="740" viewBox="0 0 760 740" role="img" aria-labelledby="title desc">
  <title id="title">Decide what goes into the next draft.</title>
  <desc id="desc">An editorial guide to author decisions: review wording for clarity and voice, follow changes to argument structure, and check altered claims against assumptions, comparisons, and evidence. Discuss edits by change ID and ask the agent to apply your selection.</desc>
  <rect width="760" height="740" rx="24" fill="#FAFBFD"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" letter-spacing="-.6" aria-label="Decide what goes into the next draft.">
      <tspan x="44" y="77">Decide what goes into</tspan>
      <tspan x="44" y="123">the next draft.</tspan>
    </text>
    <text fill="#48566B" font-size="26" aria-label="A revision can improve prose, reshape an argument, or change a claim.">
      <tspan x="46" y="168">A revision can improve prose,</tspan>
      <tspan x="46" y="202">reshape an argument, or change a claim.</tspan>
    </text>
    <path d="M 44 227 H 716" stroke="#DDE3EC" stroke-width="1"/>
    <path d="M 44 227 H 104" stroke="#742F75" stroke-width="2" stroke-linecap="round"/>

    <text x="46" y="260" font-size="18" font-weight="700" letter-spacing="1.3" aria-label="01 · LANGUAGE"><tspan fill="#742F75">01</tspan><tspan fill="#647086" xml:space="preserve"> · LANGUAGE</tspan></text>
    <text x="44" y="299" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" letter-spacing="-.2">Is the wording clearer?</text>
    <text x="46" y="336" fill="#416748" font-size="27">Check terminology and author voice.</text>
    <path d="M 44 364 H 716" stroke="#DDE3EC" stroke-width="1"/>

    <text x="46" y="397" font-size="18" font-weight="700" letter-spacing="1.3" aria-label="02 · STRUCTURE"><tspan fill="#742F75">02</tspan><tspan fill="#647086" xml:space="preserve"> · STRUCTURE</tspan></text>
    <text x="44" y="436" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" letter-spacing="-.2">Does the argument flow?</text>
    <text x="46" y="473" fill="#416748" font-size="27">Follow moved and merged passages.</text>
    <path d="M 44 501 H 716" stroke="#DDE3EC" stroke-width="1"/>

    <text x="46" y="534" font-size="18" font-weight="700" letter-spacing="1.3" aria-label="03 · MEANING"><tspan fill="#742F75">03</tspan><tspan fill="#647086" xml:space="preserve"> · MEANING</tspan></text>
    <text x="44" y="573" fill="#172033" font-family="Georgia, 'Times New Roman', serif" font-size="33" font-weight="700" letter-spacing="-.2">Has the claim changed?</text>
    <text x="46" y="610" fill="#416748" font-size="27">Check assumptions, comparisons, and evidence.</text>
    <path d="M 44 638 H 716" stroke="#DDE3EC" stroke-width="1"/>

    <text fill="#566378" font-size="23" aria-label="Discuss edits by change ID. Ask the agent to apply your selection.">
      <tspan x="46" y="679">Discuss edits by change ID.</tspan>
      <tspan x="46" y="712">Ask the agent to apply your selection.</tspan>
    </text>
  </g>
</svg>
